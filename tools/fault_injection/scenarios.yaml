# Fault scenarios for the benchmarks.
#
#   fault     : fault of tools/fault_injection/inject.py
#   mode      : loop  -> the agent is woken up by an alert (log or fault code)
#               check -> spot check started after the injection (silent fault)
#   expected  : the right answer, for grading
#     cause    : description of the expected root cause (also given to the Claude judge)
#     keywords : at least one word of each group must appear in the report's root cause

- id: payload-2kg
  fault: wrong_payload
  mode: check
  expected:
    cause: The declared payload (2 kg) does not match the tool actually mounted (empty).
    keywords: [[payload, load, mass], [declared, configur, setting]]

- id: urscript-syntax
  fault: script_error
  mode: loop
  expected:
    cause: The URScript program sent to the controller contains a syntax error.
    keywords: [[syntax, script, program]]

- id: protective-stop
  fault: protective_stop
  mode: loop
  expected:
    cause: Protective stop triggered by the program (protective_stop), without any mechanical defect.
    keywords: [[protective, C209]]

- id: controller-crash
  fault: controller_crash
  mode: check
  expected:
    cause: The controller process (URControl) stopped; there is no more communication with the robot.
    keywords: [[controller, URControl, process], [stop, crash, communication, unreachable, no response]]

- id: controller-freeze
  fault: freeze
  mode: check
  expected:
    cause: The controller stopped answering for a few seconds (freeze, communication loss), then resumed.
    keywords: [[communication, freeze, interruption, cut, loss, froze]]
