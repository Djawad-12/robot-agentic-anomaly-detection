# Scénarios de pannes pour les benchmarks.
#
#   fault     : panne de tools/fault_injection/inject.py
#   mode      : loop  -> l'agent est réveillé par une alerte (journal ou code d'erreur)
#               check -> contrôle ponctuel lancé après l'injection (panne silencieuse)
#   expected  : la bonne réponse, pour la notation
#     cause    : description de la cause racine attendue
#     keywords : au moins un mot de chaque groupe doit apparaître dans la cause racine du rapport

- id: payload-2kg
  fault: wrong_payload
  mode: check
  expected:
    cause: La charge utile déclarée (2 kg) ne correspond pas à l'outil réellement monté (vide).
    keywords: [[charge, payload, masse], [déclar, configur, réglage]]

- id: urscript-syntax
  fault: script_error
  mode: loop
  expected:
    cause: Le programme URScript envoyé au contrôleur contient une erreur de syntaxe.
    keywords: [[syntaxe, syntax, script, programme]]

- id: protective-stop
  fault: protective_stop
  mode: loop
  expected:
    cause: Arrêt de protection déclenché par le programme (protective_stop), sans défaut mécanique.
    keywords: [[protection, protective, C209]]

- id: controller-crash
  fault: controller_crash
  mode: check
  expected:
    cause: Le processus du contrôleur (URControl) s'est arrêté ; plus aucune communication avec le robot.
    keywords: [[contrôleur, controller, URControl, processus], [arrêt, crash, communication, injoignable, plus de réponse]]

- id: controller-freeze
  fault: freeze
  mode: check
  expected:
    cause: Le contrôleur a cessé de répondre pendant quelques secondes (gel, perte de communication), puis a repris.
    keywords: [[communication, gel, interruption, coupure, perte, figé]]
