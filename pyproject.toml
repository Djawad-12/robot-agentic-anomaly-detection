[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-agentic"
version = "0.2.0"
description = "Software anomaly detection agent: finds the root cause of a robot failure from its signals, logs, fault codes and documentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "langgraph>=0.6",
  "numpy>=2.1",
  "matplotlib>=3.9",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
robot-agentic = "robot_agentic.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_agentic = ["agent/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# ANN: type annotations required; D: docstrings required (see CONTRIBUTING.md).
select = ["E", "F", "W", "I", "B", "UP", "ANN", "D"]
# ANN401: `Any` stays allowed for truly dynamic JSON data.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
